name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      # The frontend's @microshala/contracts dep is a link: to the backend
      # repo's src/contracts — check it out as a sibling dir so pnpm install
      # resolves. Private repo: add a PAT as BACKEND_REPO_TOKEN secret.
      - uses: actions/checkout@v4
        with:
          repository: Saurabh-Taylor/lms-cms-dashboard-nest
          path: cms-lms-test-devin-swe-2-nest-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
